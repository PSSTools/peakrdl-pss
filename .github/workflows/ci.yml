name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]"
      - run: ruff check src tests
      - run: mypy

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]
        systemrdl: ["min", "latest"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e ".[test]"
      - name: Pin the minimum supported systemrdl-compiler
        if: matrix.systemrdl == 'min'
        run: python -m pip install "systemrdl-compiler==1.27.*"
      # pssparser and peakrdl-uvm are absent here, so their suites skip. The
      # parser-gate job below is what makes the parser a hard requirement --
      # keeping them separate means a missing tool cannot silently downgrade
      # this job from "verified" to "skipped".
      - run: pytest -m "not slow" --cov=peakrdl_pss --cov-report=term-missing --cov-fail-under=85

  parser-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[test]" pssparser
      # The suite skips rather than fails when the parser is absent, so that it
      # stays usable off CI. Here the parser is required, so a skip must fail the
      # job -- otherwise a broken install would turn the gate green.
      - name: Every generated package must parse and link
        run: pytest tests/golden -q -rs | tee out.txt
      - name: The gate must have run, not skipped
        run: "! grep -q 'pssparser CLI not found' out.txt"

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e . -r docs/requirements.txt
      - run: sphinx-build -b html -W --keep-going docs docs/_build/html
