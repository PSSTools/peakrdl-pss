name: CI

on:
  push:
    branches: [main]
    # TAGS ADDED 2026-09-09, and they are load-bearing: without this the `v*`
    # tag that releases this package did not trigger this workflow at all, so
    # the publish job below could never have fired no matter what the switch
    # said.
    tags: ["v*"]
  pull_request:

jobs:
  # The release-authority master switch. Resolved in its OWN job because an
  # `if:` on a job cannot reference a step in that same job, so the value has
  # to arrive through `needs.<job>.outputs`.
  #
  # A consumer that reads needs.gate.outputs WITHOUT declaring `needs: gate`
  # gets an EMPTY STRING rather than an error -- the publish condition is then
  # false forever, nothing publishes, and nothing goes red. That is the
  # quietest failure available here, so `publish-pypi` below declares it.
  #
  # Deliberately a copy of the .forgejo workflow's `gate` rather than a shared
  # definition: the two forges cannot reference a common file, and a gate that
  # silently stopped matching its counterpart is the failure this whole
  # mechanism exists to prevent.
  gate:
    name: Release authority
    runs-on: ubuntu-latest
    outputs:
      authority: ${{ steps.resolve.outputs.authority }}
    steps:
      - id: resolve
        # The python is ONE LINE on purpose: a multi-line `python3 -c` body has
        # to start at column 0, which terminates the YAML block scalar above it
        # and silently corrupts the workflow rather than failing to parse.
        run: |
          url=https://dvkit.org/.well-known/release-authority.json
          if ! body=$(curl -fsS --max-time 10 "$url"); then
            case "$GITHUB_REF" in
              refs/tags/v*)
                echo "::error::release-authority switch unreachable; refusing to publish"
                exit 1 ;;
              *)
                echo "authority=none" >> "$GITHUB_OUTPUT"
                echo "switch unreachable on a non-tag ref; nothing to release"
                exit 0 ;;
            esac
          fi
          auth=$(printf '%s' "$body" | python3 -c 'import json,os,sys; d=json.load(sys.stdin); r=os.environ["GITHUB_REPOSITORY"]; print(d["repos"].get(r) or d["orgs"].get(r.split("/")[0]) or d["default"])')
          echo "release authority for $GITHUB_REPOSITORY: $auth"
          echo "authority=$auth" >> "$GITHUB_OUTPUT"

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]"
      - run: ruff check src tests
      - run: mypy

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]
        systemrdl: ["min", "latest"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e ".[test]"
      - name: Pin the minimum supported systemrdl-compiler
        if: matrix.systemrdl == 'min'
        run: python -m pip install "systemrdl-compiler==1.30.*"
      # pssparser and peakrdl-uvm are absent here, so their suites skip. The
      # parser-gate job below is what makes the parser a hard requirement --
      # keeping them separate means a missing tool cannot silently downgrade
      # this job from "verified" to "skipped".
      - run: pytest -m "not slow" --cov=peakrdl_pss --cov-report=term-missing --cov-fail-under=85

  parser-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[test]" pssparser
      # The suite skips rather than fails when the parser is absent, so that it
      # stays usable off CI. Here the parser is required, so a skip must fail the
      # job -- otherwise a broken install would turn the gate green.
      - name: Every generated package must parse and link
        run: pytest tests/golden -q -rs | tee out.txt
      - name: The gate must have run, not skipped
        run: "! grep -q 'pssparser CLI not found' out.txt"

  cli-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[test,cli]"
      # Same shape as parser-gate, for the same reason. peakrdl is optional at
      # runtime, so the test job above skips the CLI suites rather than failing
      # -- which keeps the package testable as a pure Python API but would let
      # CLI/API drift go unnoticed forever. This job is where the CLI is a hard
      # requirement.
      - name: The CLI surface must match the Python API
        run: pytest tests/integration -q -rs | tee out.txt
      - name: The gate must have run, not skipped
        run: "! grep -q 'peakrdl-cli not installed' out.txt"

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e . -r docs/requirements.txt
      - run: sphinx-build -b html -W --keep-going docs docs/_build/html

  publish-pypi:
    # ADDED 2026-09-09, so that release authority for this repo can move to
    # "github" in sync-policy.toml. This repo was pinned to "forgejo" for the
    # only reason that mattered: the .forgejo pipeline was the only publisher it
    # had, so the estate default of "github" would have left it with no release
    # path at all -- a tag pushed, nothing published, and nothing red.
    #
    # BOTH CLAUSES ARE LOAD-BEARING.
    #
    #   refs/tags/v*   this repo is mirrored to Forgejo and back on a five-minute
    #                  cron, and git-sync moves the DEFAULT BRANCH. A branch-gated
    #                  publisher is therefore satisfied by a sync cycle -- mirroring
    #                  would be a release trigger. A tag is a deliberate act; a
    #                  cycle never creates one.
    #
    #   authority      the release-authority master switch. Its counterpart in
    #                  .forgejo/workflows/ci.yml tests for 'forgejo', so exactly
    #                  one of the two can fire for any given tag. Both forges
    #                  receive every tag, so without this they would race, and on
    #                  PyPI a version can be yanked but never reused.
    #
    # `needs` mirrors the .forgejo side's [gate, test, parser-gate]: the whole
    # premise of this project is that its output is accepted by a PSS parser, so
    # a release that skipped that check would be a release of the one thing we
    # promise not to ship. cli-gate is included here because it exists on this
    # forge and a release should not skip a check that is available to it.
    if: >-
      startsWith(github.ref, 'refs/tags/v') &&
      needs.gate.outputs.authority == 'github'
    needs: [gate, test, parser-gate, cli-gate]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build distributions
        # No version stamping: this job only ever runs on a tag, where the
        # .forgejo side deliberately leaves the version clean too.
        run: |
          python -m pip install --upgrade pip build twine
          rm -rf dist/
          python -m build .
          python -m twine check dist/*

      - name: Check the tag matches the package version
        # Guards against tagging v0.1.0 while __about__.py still says 0.0.1 --
        # which would publish a release under the wrong number, unfixably.
        # Identical check to the .forgejo side, deliberately: whichever forge
        # holds authority, the same guarantee has to hold.
        run: |
          tag="${GITHUB_REF#refs/tags/v}"
          ver=$(grep '^__version__ = ' src/peakrdl_pss/__about__.py | sed 's/.*"\(.*\)".*/\1/')
          echo "tag=$tag  __version__=$ver"
          if [ "$tag" != "$ver" ]; then
            echo "::error::tag v$tag does not match __version__ $ver in src/peakrdl_pss/__about__.py"
            exit 1
          fi
          # PyPI normalizes '-' to '_' in filenames, so the wheel is peakrdl_pss-.
          for f in dist/*; do
            case "$(basename "$f")" in
              peakrdl_pss-${ver}-*.whl|peakrdl_pss-${ver}.tar.gz) ;;
              *) echo "::error::$(basename "$f") is not version ${ver}"; exit 1 ;;
            esac
          done
          echo "OK: tag, source version and all artifacts agree on ${ver}"

      - name: Publish to PyPI
        # Plain twine rather than pypa/gh-action-pypi-publish, matching the
        # .forgejo side step for step. PYPI_API_TOKEN is an organization secret
        # on psstools.
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
        run: |
          if [ -z "$TWINE_PASSWORD" ]; then
            echo "::error::PYPI_API_TOKEN is not set for this repository"
            exit 1
          fi
          python -m pip install --upgrade twine
          python -m twine check dist/*
          # Idempotence net: with one switch and two possible publishers, a
          # misconfiguration should cost a no-op rather than a hard failure.
          python -m twine upload --non-interactive --skip-existing dist/*
          echo "published $(ls dist/* | wc -l) artifacts"
